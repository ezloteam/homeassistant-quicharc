name: Validate HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # A HACS custom repository, not in the default store: not
          # registered in home-assistant/brands, and licensed under the Ezlo
          # Available Source License, which isn't OSI-approved (HACS's
          # license check is only a default-store rule).
          ignore: "brands license"
