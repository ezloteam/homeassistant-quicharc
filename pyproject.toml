[project]
name = "homeassistant-quicharc"
version = "0.1.0"
description = "QuicHarc: remote access to Home Assistant through the Ezlo cloud"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Home Assistant 2026.11 aliases httpx to httpx2 on import, before anything
# imports httpx; the respx plugin would import it first. Its helpers still use
# respx directly.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.quicharc", "homeassistant"]
force-sort-within-sections = true
combine-as-imports = true
